name: Build Florida 16.5.6 游戏对抗级 (Server魔改终极版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装完整编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            build-essential \
            lib32stdc++-12-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            curl git zip sed \
            python3 python3-dev python3-pip \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            upx \
            openjdk-11-jdk \
            valac \
            clang

      - name: 修复Python头文件路径
        run: python3 -c "import sysconfig; print(sysconfig.get_paths())"

      - name: 克隆 Frida 16.5.6（含子模块）
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用 Florida 补丁（仅复制存在的文件）
        run: |
          cd frida
          # 安全复制，避免覆盖子模块目录结构
          for file in $(cd ../florida && find . -type f); do
            mkdir -p $(dirname "$file")
            cp -f "../florida/$file" "$file" 2>/dev/null || true
          done

      - name: 移除 frida-python 避免编译冲突
        run: |
          cd frida
          sed -i 's/^\(.*subproject.*frida-python.*\)$/#\1/' meson.build || true

      - name: 游戏级深度去特征修改（动态路径查找）
        run: |
          cd frida
          
          # 定义查找函数，确保文件存在才修改
          find_and_sed() {
            local pattern=$1
            local find_path=$2
            local sed_expr=$3
            find "$find_path" -type f -name "$pattern" 2>/dev/null | while read file; do
              echo "修改: $file"
              sed -i "$sed_expr" "$file"
            done
          }
          
          # 查找关键目录（Florida补丁可能移动了文件位置）
          GUM_DIR=$(find . -type d -path "*/frida-gum/gum" 2>/dev/null | head -1)
          CORE_DIR=$(find . -type d -path "*/frida-core" 2>/dev/null | head -1)
          SERVER_DIR=$(find . -type d -path "*/server" 2>/dev/null | head -1)
          
          echo "GUM_DIR: $GUM_DIR"
          echo "CORE_DIR: $CORE_DIR"
          
          # ---------- 基础伪装 ----------
          # 端口修改：查找所有包含 FRIDA_SERVER_PORT 的文件
          find . -name "*.c" -o -name "*.h" | xargs sed -i 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' 2>/dev/null || true
          
          # maps 中的库名（动态查找）
          if [ -n "$GUM_DIR" ]; then
            sed -i 's/"frida-agent"/"libart"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null || true
            sed -i 's/"frida-jit"/"libhwui"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null || true
            # 线程名
            sed -i 's/"gum-js-loop"/"Finalizer"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"frida-thread"/"Binder_1"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            # ptrace 绕过
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null || true
            # 取消 RWX
            sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' "$GUM_DIR"/gummemory.c 2>/dev/null || true
          fi
          
          # 进程名修改
          find . -name "frida-server.c" -exec sed -i 's/"frida-server"/"surfaceflinger"/g' {} \; 2>/dev/null || true
          
          # ---------- D-Bus 协议彻底伪装 ----------
          if [ -n "$CORE_DIR" ]; then
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"REJECT"/"ACCEPT"/g' {} \; 2>/dev/null || true
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"frida"/"system"/g' {} \; 2>/dev/null || true
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"FRIDA"/"SYSTEM"/g' {} \; 2>/dev/null || true
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"re\.frida"/"android\.sys"/g' {} \; 2>/dev/null || true
          fi
          
          # ---------- RPC 字符串混淆 ----------
          find . -name "rpc.vala" -exec sed -i 's/"frida:rpc"/"sys:ipc"/g' {} \; 2>/dev/null || true
          find . -name "rpc.vala" -exec sed -i 's/"frida:auth"/"sys:cred"/g' {} \; 2>/dev/null || true
          
          # ---------- 符号表与入口点混淆 ----------
          find . -name "*.vala" -o -name "*.c" | xargs sed -i 's/frida_agent_main/android_main/g' 2>/dev/null || true
          find . -name "gum.c" -exec sed -i 's/g_set_prgname ("frida")/g_set_prgname ("android_serv")/g' {} \; 2>/dev/null || true
          
          # ---------- IPC 目录隐藏 ----------
          find . -name "server.vala" -exec sed -i 's/DEFAULT_DIRECTORY = "frida"/DEFAULT_DIRECTORY = ".sys"/g' {} \; 2>/dev/null || true
          
          # ---------- memfd 匿名文件特征修改 ----------
          find . -name "frida-helper-backend.vala" -exec sed -i 's/"frida"/"jit-cache"/g' {} \; 2>/dev/null || true
          
          echo "源码修改完成"

      - name: 编译 Android arm64 服务端
        run: |
          cd frida
          make server-android-arm64

      - name: 后编译二进制深度修补（消除所有残留特征）
        run: |
          cd frida
          SERVER_BIN=$(find build -name "frida-server" -type f 2>/dev/null | head -1)
          if [ ! -f "$SERVER_BIN" ]; then
            echo "错误：未找到编译产物 frida-server"
            exit 1
          fi
          
          echo "修补二进制文件: $SERVER_BIN"
          
          # 使用 sed 直接修改二进制中的字符串（长度必须相同或更短）
          # 注意：使用 echo 先检查字符串是否存在
          if strings "$SERVER_BIN" | grep -q "frida:rpc"; then
            sed -i 's/frida:rpc/sys:ipc/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "FRIDA"; then
            sed -i 's/FRIDA/SYSD/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "frida-agent"; then
            sed -i 's/frida-agent/libart/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "gum-js-loop"; then
            sed -i 's/gum-js-loop/Finalizer/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "frida-thread"; then
            sed -i 's/frida-thread/Binder_1/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "frida-server"; then
            sed -i 's/frida-server/surfaceflinger/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "frida-jit"; then
            sed -i 's/frida-jit/libhwui/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "gmain"; then
            sed -i 's/gmain/HeapTask/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "gdbus"; then
            sed -i 's/gdbus/IPCThread/g' "$SERVER_BIN"
          fi
          if strings "$SERVER_BIN" | grep -q "re.frida"; then
            sed -i 's/re.frida/android.sys/g' "$SERVER_BIN"
          fi
          
          # 清理调试信息并压缩
          strip --strip-all "$SERVER_BIN" 2>/dev/null || true
          upx --best --lzma "$SERVER_BIN" 2>/dev/null || true
          
          echo "二进制修补完成"
          # 验证
          echo "=== 修补后残留特征检查 ==="
          strings "$SERVER_BIN" | grep -iE "frida|27042|gmain|gdbus|REJECT" || echo "未发现明显特征"
          
          # 复制到输出目录
          mkdir -p ../out
          cp "$SERVER_BIN" ../out/frida-server

      - name: 生成运行时反检测脚本
        run: |
          cat > out/anti-detect.js << 'EOF'
          // 游戏级运行时对抗脚本
          // 启动时加载: frida-server -x /path/to/anti-detect.js
          
          // 1. Hook 文件访问（/proc/self/maps, /proc/self/status）
          var openPtr = Module.findExportByName(null, "open");
          if (openPtr) {
              Interceptor.attach(openPtr, {
                  onEnter: function(args) {
                      var path = args[0].readCString();
                      if (path && path.indexOf("/proc/") !== -1) {
                          if (path.indexOf("/maps") !== -1 || path.indexOf("/status") !== -1) {
                              this.isSuspicious = true;
                          }
                      }
                  },
                  onLeave: function(retval) {
                      if (this.isSuspicious) {
                          retval.replace(-1);
                      }
                  }
              });
          }
          
          // 2. Hook pthread_setname_np 防止线程名检测
          var pthread_setname_np = Module.findExportByName(null, "pthread_setname_np");
          if (pthread_setname_np) {
              Interceptor.attach(pthread_setname_np, {
                  onEnter: function(args) {
                      var name = args[1].readCString();
                      if (name && (name.indexOf("gmain") !== -1 || name.indexOf("gdbus") !== -1)) {
                          args[1] = Memory.allocUtf8String("HeapWorker");
                      }
                  }
              });
          }
          
          // 3. Java 层 Hook（如果附加到 Java 进程）
          Java.perform(function() {
              // Hook Debug.getNativeLibrarys
              var Debug = Java.use("android.os.Debug");
              if (Debug.getNativeLibrarys) {
                  Debug.getNativeLibrarys.implementation = function() {
                      var libs = this.getNativeLibrarys();
                      var filtered = [];
                      for (var i = 0; i < libs.length; i++) {
                          var l = libs[i].toLowerCase();
                          if (l.indexOf("frida") === -1 && l.indexOf("gum") === -1 && l.indexOf("sys") === -1) {
                              filtered.push(libs[i]);
                          }
                      }
                      return filtered;
                  };
              }
              
              // Hook System.loadLibrary
              var System = Java.use("java.lang.System");
              System.loadLibrary.implementation = function(libname) {
                  if (libname.toLowerCase().indexOf("frida") !== -1) {
                      return;
                  }
                  return this.loadLibrary(libname);
              };
              
              // Hook 文件存在性检测
              var File = Java.use("java.io.File");
              File.exists.implementation = function() {
                  var path = this.getAbsolutePath();
                  if (path && path.indexOf("frida") !== -1) {
                      return false;
                  }
                  return this.exists();
              };
          });
          
          console.log("[Anti] Runtime hooks installed.");
          EOF
          
          echo "运行时脚本生成完毕"

      - name: 打包最终产物
        run: |
          cd out
          zip frida-game-moded.zip frida-server anti-detect.js
          
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-game-moded
          path: out/frida-game-moded.zip
