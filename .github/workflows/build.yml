name: Build Frida 16.5.6 终极隐身版 (内存优化版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 优化系统内存 (开启 Swap)
        run: |
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1G count=8
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev lib32z1-dev libc6-dev-i386 curl git zip sed python3 python3-dev python3-pip libglib2.0-dev ninja-build pkg-config upx openjdk-11-jdk valac clang llvm-14 gcc-multilib g++-multilib binutils
          pip3 install --upgrade pip

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          path: frida

      - name: 克隆 Florida 并集成
        run: |
          git clone --recursive --depth 1 -b 16.5.6 https://github.com/Ylarod/Florida florida
          cp -rvf florida/* frida/ || true

      - name: 【第一层至第三层】源码混淆 (原逻辑)
        run: |
          cd frida
          TARGET_DIRS="frida-gum frida-core server src"
          
          # 1. 隐藏 Hook 数据结构
          G_INTER=$(find frida-gum -name "guminterceptor.c" | head -1)
          if [ -f "$G_INTER" ]; then
            sed -i 's/struct.*_GumInterceptor/struct _GumSystemMonitor/g' "$G_INTER"
            sed -i 's/GumInterceptor/GumSystemMonitor/g' "$G_INTER"
            sed -i 's/attached_listeners/registered_callbacks/g' "$G_INTER"
            sed -i 's/gum_interceptor_attach/gum_system_monitor_register/g' "$G_INTER"
          fi
          
          # 2. 基础字符串混淆 (限制范围)
          find $TARGET_DIRS -type f \( -name "*.c" -o -name "*.h" -o -name "*.vala" \) 2>/dev/null | xargs sed -i \
            -e 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' \
            -e 's/"frida"/"arm64v8"/g' \
            -e 's/frida_/android_/g' \
            -e 's/FRIDA_/ANDROID_/g' \
            -e 's/"frida-server"/"com.android.system.sync"/g' \
            -e 's/"frida-agent"/"libandroid_runtime"/g' 2>/dev/null || true

          # 3. 线程与内存隐藏
          GUM_DIR=$(find frida-gum -type d -name "gum" | head -1)
          if [ -n "$GUM_DIR" ]; then
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"gmain"/"GCHandlerThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null || true
          fi

      - name: 【第四层】编译参数注入
        run: |
          cd frida
          # 确保注入位置正确
          sed -i "/strip: true,/a \ \nadd_global_arguments('-O1', '-fno-inline', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections', language: 'c')" meson.build

      - name: 编译 Android arm64 服务端 (防 OOM 模式)
        run: |
          cd frida
          # 关键优化：使用 -j 2 限制并行数，防止内存耗尽。禁用不需要的组件。
          export CFLAGS="-O1 -fvisibility=hidden"
          # 禁用 Python/Node 等不相关组件以减少内存开销
          sed -i "s/option('python',/option('python_disabled',/" meson_options.txt || true
          
          # 执行编译，NINJA_FLAGS="-j 2" 是为了在 7G 内存限制下稳定完成
          make server-android-arm64 NINJA_FLAGS="-j 2" || (free -h && tail -n 100 build/meson-logs/meson-log.txt && exit 1)

      - name: 【第五层】后编译二进制混淆
        run: |
          cd frida
          SERVER_BIN=$(find build/ -name frida-server -type f | grep android-arm64 | head -n 1)
          
          if [ -z "$SERVER_BIN" ]; then
            echo "错误：未找到编译产物"
            find build/ -maxdepth 5
            exit 1
          fi
          
          mkdir -p ../out
          cp "$SERVER_BIN" ../out/frida-server-final
          cd ../out
          
          # 二进制混淆 (原逻辑)
          strip --strip-all frida-server-final
          python3 -c "f=open('frida-server-final','r+b'); f.seek(7); f.write(b'\x00\x00'); f.close()"
          upx --best --lzma frida-server-final || true
          
          # 生成对抗脚本 (原逻辑)
          cat > anti-detect.js << 'EOF'
          function initialize() {
              var prctl = Module.findExportByName(null, "prctl");
              if (prctl) {
                  Interceptor.attach(prctl, { onEnter: function(args) { if (args[0].toInt32() === 15) args[1] = Memory.allocUtf8String("surfaceflinger"); } });
              }
              console.log("[✓] 终极对抗系统已启动");
          }
          setTimeout(initialize, 1000);
          EOF

      - name: 打包与上传
        run: |
          cd out
          zip -r frida-ultimate.zip frida-server-final anti-detect.js
          sha256sum frida-ultimate.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip
