name: Build Frida 16.5.6 终极隐身版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            build-essential lib32stdc++-12-dev lib32z1-dev libc6-dev-i386 \
            curl git zip sed python3 python3-dev python3-pip libglib2.0-dev \
            ninja-build pkg-config upx openjdk-11-jdk valac clang llvm-14 \
            gcc-multilib g++-multilib binutils
          pip3 install --upgrade pip 2>/dev/null || true

      - name: 安装 Meson 1.3.2
        run: |
          pip3 install meson==1.3.2 ninja
          meson --version

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用 Florida 补丁
        run: |
          cd frida
          for file in $(cd ../florida && find . -type f); do
            mkdir -p $(dirname "$file")
            cp -f "../florida/$file" "$file" 2>/dev/null || true
          done

      - name: 屏蔽 frida-python 子项目
        run: |
          cd frida
          sed -i 's/^.*subproject.*frida-python.*/#&/' meson.build 2>/dev/null || true

      - name: 强制替换内置 Meson → 1.3.2
        run: |
          cd frida
          rm -rf releng/meson
          mkdir -p releng/meson
          ln -s "$(which meson)" releng/meson/meson.py
          python3 releng/meson/meson.py --version

      - name: 修复 meson.build 版本语法
        run: |
          cd frida
          sed -i '1,20{/project(/,/)/c\project('\''frida'\'','\''c'\'',version: '\''16.5.6'\'')}' meson.build

      - name: 第一层：源码级混淆
        run: |
          cd frida
          GUM_INTERCEPTOR=$(find . -path "*/frida-gum/*" -name "guminterceptor.c" | head -1)
          if [ -f "$GUM_INTERCEPTOR" ]; then
            sed -i 's/struct.*_GumInterceptor/struct _GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/GumInterceptor/GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/attached_listeners/registered_callbacks/g' "$GUM_INTERCEPTOR"
            sed -i 's/listener_list/event_queue/g' "$GUM_INTERCEPTOR"
            sed -i 's/attached_probes/active_monitors/g' "$GUM_INTERCEPTOR"
            sed -i 's/probe_list/monitor_stack/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_attach/gum_system_monitor_register/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_detach/gum_system_monitor_unregister/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_replace/gum_system_event_dispatch/g' "$GUM_INTERCEPTOR"
          fi

          find . -name "*.c" -o -name "*.h" | xargs sed -i \
            -e 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' \
            -e 's/"frida"/"arm64v8"/g' -e 's/"FRIDA"/"ARM64V8"/g' \
            -e 's/frida_/android_/g' -e 's/FRIDA_/ANDROID_/g' \
            -e 's/"frida-server"/"com.android.system.sync"/g' \
            -e 's/"frida-agent"/"libandroid_runtime"/g' \
            -e 's/"frida-jit"/"libhwui"/g' \
            -e 's/"frida-helper"/"libc++_shared"/g' \
            -e 's/"gum-"/"lib"/g' 2>/dev/null || true

          find . -name "*.vala" | xargs sed -i \
            -e 's/"REJECT"/"ACCEPT"/g' -e 's/"frida"/"system"/g' -e 's/"FRIDA"/"SYSTEM"/g' \
            -e 's/"frida:rpc"/"android:ipc"/g' -e 's/"frida:auth"/"android:auth"/g' \
            -e 's/"re\.frida"/"com\.android\.internal"/g' -e 's/frida_/android_/g' 2>/dev/null || true

          find . \( -name "*.c" -o -name "*.h" -o -name "*.vala" \) | xargs sed -i \
            -e 's/on_function_enter/on_system_callback/g' \
            -e 's/on_function_leave/on_system_exit/g' \
            -e 's/gum_interceptor_/gum_system_monitor_/g' \
            -e 's/gum_probe_/gum_event_/g' \
            -e 's/gum_listener_/gum_handler_/g' 2>/dev/null || true

      - name: 第二层：线程与进程隐藏
        run: |
          cd frida
          GUM_DIR=$(find . -type d -path "*/frida-gum/gum" 2>/dev/null | head -1)
          if [ -n "$GUM_DIR" ]; then
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null
            sed -i 's/"frida-thread"/"System_Server"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null
            sed -i 's/"gmain"/"GCHandlerThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null
            sed -i 's/"gdbus"/"DBusServiceThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null
            sed -i 's/"frida-agent"/"libart"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null
            sed -i 's/"frida-jit"/"libhwui"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null
            sed -i 's/"gum-allocator"/"libc_allocator"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null
            sed -i 's/"frida-server"/"surfaceflinger"/g' "$GUM_DIR"/../frida-server.c 2>/dev/null
            sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' "$GUM_DIR"/gummemory.c 2>/dev/null
            sed -i 's/PROT_READ.*PROT_WRITE.*PROT_EXEC/PROT_READ | PROT_WRITE/g' "$GUM_DIR"/gummemory.c 2>/dev/null
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null
          fi

          CORE_DIR=$(find . -type d -path "*/frida-core" 2>/dev/null | head -1)
          if [ -n "$CORE_DIR" ]; then
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"frida"/"system"/g' {} \; 2>/dev/null
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"re\.frida"/"android\.sys"/g' {} \; 2>/dev/null
          fi

      - name: 第三层：ARM64 代码混淆
        run: |
          cd frida
          ARM64_FILES=$(find . -path "*/frida-gum/*" \( -name "*arm64*" -o -name "*aarch64*" \) -name "*.c" 2>/dev/null)
          for file in $ARM64_FILES; do
            [ -f "$file" ] || continue
            sed -i 's/\bb\s\+/adrp x8, #0; ldr x8, [x8]; br x8  \/\/ BRANCH /g' "$file" 2>/dev/null
            sed -i '/^[[:space:]]*mov\|^[[:space:]]*ldr\|^[[:space:]]*str/i\    nop; nop; nop;' "$file" 2>/dev/null
            sed -i 's/movz\s\+x\([0-9]\+\)/nop; movz x\1/g' "$file" 2>/dev/null
          done

      - name: 第四层：编译选项优化
        run: |
          cd frida
          find . -maxdepth 4 -name "meson.build" | while read f; do
            grep -q "project(" "$f" || continue
            sed -i "/project(/a\
              add_global_arguments('-O1','-fno-inline','-fno-reorder-blocks','-fno-reorder-functions','-fno-optimize-sibling-calls','-fno-asynchronous-unwind-tables','-fno-unwind-tables','-fvisibility=hidden','-ffunction-sections','-fdata-sections',language: 'c')" "$f" 2>/dev/null
          done

      - name: 编译 Android arm64
        run: |
          cd frida
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          rm -rf build
          export CFLAGS="-O1 -g0 -fno-inline -fno-reorder-blocks -fno-optimize-sibling-calls -fvisibility=hidden -ffunction-sections -fdata-sections"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-Wl,--gc-sections,-z,relro,-z,now,--no-merge-exidx-entries"
          make server-android-arm64 2>&1 | tail -50

      - name: 第五层：二进制混淆
        run: |
          cd frida
          SERVER_BIN=$(find build -name "frida-server" -type f | head -1)
          [ -f "$SERVER_BIN" ] || { echo "未找到产物"; exit 1; }
          mkdir -p ../out

          STRINGS_TO_REPLACE=(
            's/gum_interceptor_attach/system_register_event___/g'
            's/gum_interceptor_detach/system_unregister_event__/g' 's/gum_interceptor/gum_system_mon/g'
            's/frida:rpc/android:ipc/g' 's/frida:auth/android:auth/g' 's/FRIDA/SYSD/g' 's/frida/android/g'
            's/Frida/Android/g' 's/27042/65535/g' 's/gmain/GCWorker/g' 's/gdbus/DBusWorker/g'
            's/gum-js-loop/JSRuntime/g' 's/frida-agent/agent64/g' 's/frida-jit/jit64/g'
            's/frida-server/system64/g' 's/gum-allocator/allocator/g' 's/gum-debug/debugger/g'
            's/gum-thread/worker/g' 's/gummemory/memory/g' 's/re\.frida/com\.android/g'
            's/"interceptor"/"monitor"/g' 's/"listener"/"handler"/g' 's/"probe"/"event"/g'
            's/"attach"/"bind"/g' 's/"detach"/"unbind"/g'
          )
          for rule in "${STRINGS_TO_REPLACE[@]}"; do
            sed -i "$rule" "$SERVER_BIN" 2>/dev/null || true
          done

          strip --strip-all "$SERVER_BIN" 2>/dev/null
          objcopy --strip-all --remove-section=.comment --remove-section=.note.gnu.build-id "$SERVER_BIN" 2>/dev/null

          python3 -c "with open('$SERVER_BIN','r+b') as f: f.seek(7); f.write(b'\x00\x00')"
          upx --best --lzma --overlay=strip "$SERVER_BIN" 2>/dev/null
          python3 -c "import os; with open('$SERVER_BIN','ab') as f: f.write(os.urandom(8192))"

          strings "$SERVER_BIN" | grep -iE "frida|interceptor|27042" && echo "[!] 残留特征" || echo "✓ 无特征"
          cp "$SERVER_BIN" ../out/frida-server-final

      - name: 生成反检测脚本
        run: |
          cat > out/anti-detect-ultimate.js << 'EOF'
          const CONFIG = {DEBUG:false};
          function hookProcessAPIs(){try{var prctl=Module.findExportByName(null,"prctl");prctl&&Interceptor.attach(prctl,{onEnter:function(a){a[0].toInt32()===15&&(a[1]=Memory.allocUtf8String("surfaceflinger"))}});["getpid","gettid"].forEach(n=>{var f=Module.findExportByName(null,n);f&&Interceptor.attach(f,{onLeave(r){r.toInt32()<1000&&r.replace(1000+r.toInt32()%9000)}})})}catch(e){}
          function hookFS(){try{[Module.findExportByName(null,"open"),Module.findExportByName(null,"openat")].forEach(f=>f&&Interceptor.attach(f,{onEnter(a){var p=this.openat?a[1]:a[0];p&&p.readCString()&&p.readCString().match(/\/proc\/.*\/(maps|status|cmdline)/)&&(this.block=1)},onLeave(r){this.block&&r.replace(-1)}}))}catch(e){}
          function hookThread(){try{var n=Module.findExportByName(null,"pthread_setname_np");n&&Interceptor.attach(n,{onEnter(a){a[1].readCString()&&a[1].readCString().match(/gmain|gdbus|gum|frida/i)&&(a[1]=Memory.allocUtf8String("Thread_"+Math.random()*10000|0))}})}catch(e){}
          function hookMmap(){try{var m=Module.findExportByName(null,"mmap");m&&Interceptor.attach(m,{onEnter(a){(a[2].toInt32()&7)===7&&a[2].ptr=ptr(a[2].toInt32()&~4)}})}catch(e){}
          function hookPtrace(){try{var p=Module.findExportByName(null,"ptrace");p&&Interceptor.attach(p,{onLeave(r){r.replace(-1)}})}catch(e){}
          function hookJava(){Java.perform(()=>{Java.use("java.lang.ClassLoader").loadClass.overload("java.lang.String").implementation=function(n){n.match(/frida|gum|xposed|hook/i)&&Error("");return this.loadClass(n)};Java.use("java.io.File").exists.implementation=function(){return this.getAbsolutePath().match(/frida|gum/)?false:this.exists()}})}
          setTimeout(()=>{hookProcessAPIs();hookFS();hookThread();hookMmap();hookPtrace();Java.available&&hookJava();console.log("[✓] 隐身模式已启动")},1000);
          EOF

      - name: 生成启动脚本
        run: |
          cat > out/run-ultimate.sh << 'EOF'
          #!/bin/bash
          ./frida-server-final -l 127.0.0.1:65535 --load=anti-detect-ultimate.js &
          echo "运行中，端口：65535"
          wait
          EOF
          chmod +x out/run-ultimate.sh
          mkdir -p out/docs

      - name: 打包
        run: |
          cd out
          zip -q frida-ultimate.zip frida-server-final anti-detect-ultimate.js run-ultimate.sh docs/
          sha256sum frida-ultimate.zip > frida-ultimate.zip.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip*
          retention-days: 30
