name: Build Florida 16.5.6 (Stealth Server Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed

      - name: Clone Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: Clone Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: Apply Florida patch
        run: |
          cp -rf florida/* frida/ 2>/dev/null

      - name: Stealth patch (Anti-Cheat)
        run: |
          cd frida
          GUM_DIR="subprojects/frida-gum/gum"

          # 端口隐藏
          sed -i 's/27042/57331/g' $GUM_DIR/gum-server.c 2>/dev/null || true

          # 内存名称隐藏 (maps)
          sed -i 's/"frida-agent"/"libsys"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true
          sed -i 's/"frida-jit"/"libcache"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true

          # 线程名隐藏
          sed -i 's/"gum-js-loop"/"sys-loop"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true
          sed -i 's/"frida-thread"/"sys-thread"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true

          # 取消RWX内存特征
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' $GUM_DIR/gummemory.c 2>/dev/null || true

      # 🔥 关键：只编译 server，跳过 Python 绑定，彻底解决 pyconfig.h
      - name: Build android-arm64 server-only
        run: |
          cd frida
          make ANDROID_ARCH=arm64 server

      - name: Upload frida-server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64
          path: frida/build/frida-android-arm64/bin/frida-server
