name: Build Florida 16.5.6 (Stealth Hook - Clean Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install full build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed \
              python3-dev python3-pip libpython3-dev

      - name: Clone Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: Clone Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: Apply Florida files
        run: |
          cp -rf florida/* frida/ 2>/dev/null || true

      # 极小、安全、不破坏功能的隐身补丁
      - name: Minimal stealth patch
        run: |
          cd frida

          # 1. 隐藏 frida-agent 名称
          sed -i 's/"frida-agent"/"liballoc"/g' lib/gum/gum-allocator.c 2>/dev/null || true

          # 2. 去掉默认端口特征
          sed -i 's/27042/51234/g' lib/gum/gum-server.c 2>/dev/null || true

          # 3. 弱化内存特征，不使用全局 RWX
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' lib/gum/gummemory.c 2>/dev/null || true

      - name: Build android-arm64
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      - name: Upload frida-server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64
          path: frida/build/frida-android-arm64/bin/frida-server
