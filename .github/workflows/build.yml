name: Build Frida 16.5.6 终极隐身版 (完全对抗 + Hook 隐藏 + 深度混淆)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装完整编译依赖 + 混淆工具
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            build-essential \
            lib32stdc++-12-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            curl git zip sed \
            python3 python3-dev python3-pip \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            upx \
            openjdk-11-jdk \
            valac \
            clang \
            llvm-14 \
            gcc-multilib \
            g++-multilib \
            binutils
          
          pip3 install --upgrade pip 2>/dev/null || true

      - name: 修复 Python 头文件路径
        run: python3 -c "import sysconfig; print(sysconfig.get_paths())"

      - name: 克隆 Frida 16.5.6（含子模块）
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用 Florida 补丁（仅复制存在的文件）
        run: |
          cd frida
          for file in $(cd ../florida && find . -type f); do
            mkdir -p $(dirname "$file")
            cp -f "../florida/$file" "$file" 2>/dev/null || true
          done

      - name: 移除 frida-python 避免编译冲突
        run: |
          cd frida
          sed -i 's/^\(.*subproject.*frida-python.*\)$/#\1/' meson.build || true

      - name: 【第一层】源码级混淆 - 数据结构与函数名混淆
        run: |
          cd frida
          
          # ========== 1. 隐藏 Hook 相关数据结构 ==========
          GUM_INTERCEPTOR=$(find . -path "*/frida-gum/*" -name "guminterceptor.c" | head -1)
          if [ -f "$GUM_INTERCEPTOR" ]; then
            echo "修改 Hook 实现: $GUM_INTERCEPTOR"
            sed -i 's/struct.*_GumInterceptor/struct _GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/GumInterceptor/GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/attached_listeners/registered_callbacks/g' "$GUM_INTERCEPTOR"
            sed -i 's/listener_list/event_queue/g' "$GUM_INTERCEPTOR"
            sed -i 's/attached_probes/active_monitors/g' "$GUM_INTERCEPTOR"
            sed -i 's/probe_list/monitor_stack/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_attach/gum_system_monitor_register/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_detach/gum_system_monitor_unregister/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_replace/gum_system_event_dispatch/g' "$GUM_INTERCEPTOR"
          fi
          
          # ========== 2. 基础字符串混淆 ==========
          find . -name "*.c" -o -name "*.h" | xargs sed -i \
            -e 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' \
            -e 's/"frida"/"arm64v8"/g' \
            -e 's/"FRIDA"/"ARM64V8"/g' \
            -e 's/frida_/android_/g' \
            -e 's/FRIDA_/ANDROID_/g' \
            -e 's/"frida-server"/"com.android.system.sync"/g' \
            -e 's/"frida-agent"/"libandroid_runtime"/g' \
            -e 's/"frida-jit"/"libhwui"/g' \
            -e 's/"frida-helper"/"libc++_shared"/g' \
            -e 's/"gum-"/"lib"/g' 2>/dev/null || true
          
          # ========== 3. Vala 文件混淆 ==========
          find . -name "*.vala" | xargs sed -i \
            -e 's/"REJECT"/"ACCEPT"/g' \
            -e 's/"frida"/"system"/g' \
            -e 's/"FRIDA"/"SYSTEM"/g' \
            -e 's/"frida:rpc"/"android:ipc"/g' \
            -e 's/"frida:auth"/"android:auth"/g' \
            -e 's/"re\.frida"/"com\.android\.internal"/g' \
            -e 's/frida_/android_/g' 2>/dev/null || true
          
          # ========== 4. 关键函数名混淆 ==========
          find . \( -name "*.c" -o -name "*.h" -o -name "*.vala" \) | xargs sed -i \
            -e 's/on_function_enter/on_system_callback/g' \
            -e 's/on_function_leave/on_system_exit/g' \
            -e 's/gum_interceptor_/gum_system_monitor_/g' \
            -e 's/gum_probe_/gum_event_/g' \
            -e 's/gum_listener_/gum_handler_/g' 2>/dev/null || true
          
          echo "✓ 源码级混淆完成"

      - name: 【第二层】线程与进程隐藏
        run: |
          cd frida
          GUM_DIR=$(find . -type d -path "*/frida-gum/gum" 2>/dev/null | head -1)
          if [ -n "$GUM_DIR" ]; then
            echo "线程隐藏: $GUM_DIR"
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"frida-thread"/"System_Server"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"gmain"/"GCHandlerThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"gdbus"/"DBusServiceThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"frida-agent"/"libart"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null || true
            sed -i 's/"frida-jit"/"libhwui"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null || true
            sed -i 's/"gum-allocator"/"libc_allocator"/g' "$GUM_DIR"/gum-allocator.c 2>/dev/null || true
            sed -i 's/"frida-server"/"surfaceflinger"/g' "$GUM_DIR"/../frida-server.c 2>/dev/null || true
            sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' "$GUM_DIR"/gummemory.c 2>/dev/null || true
            sed -i 's/PROT_READ.*PROT_WRITE.*PROT_EXEC/PROT_READ | PROT_WRITE/g' "$GUM_DIR"/gummemory.c 2>/dev/null || true
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null || true
          fi
          CORE_DIR=$(find . -type d -path "*/frida-core" 2>/dev/null | head -1)
          if [ -n "$CORE_DIR" ]; then
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"frida"/"system"/g' {} \; 2>/dev/null || true
            find "$CORE_DIR" -name "*.vala" -exec sed -i 's/"re\.frida"/"android\.sys"/g' {} \; 2>/dev/null || true
          fi
          echo "✓ 进程与线程隐藏完成"

      - name: 【第三层】ARM64 代码级混淆 - 隐藏 Hook 指令模式
        run: |
          cd frida
          ARM64_FILES=$(find . -path "*/frida-gum/*" \( -name "*arm64*" -o -name "*aarch64*" \) -name "*.c" 2>/dev/null)
          for file in $ARM64_FILES; do
            if [ -f "$file" ]; then
              echo "修改 ARM64 代码: $file"
              sed -i 's/\bb\s\+/adrp x8, #0; ldr x8, [x8]; br x8  \/\/ BRANCH /g' "$file" 2>/dev/null || true
              sed -i '/^[[:space:]]*mov\|^[[:space:]]*ldr\|^[[:space:]]*str/i\    nop; nop; nop;' "$file" 2>/dev/null || true
              sed -i 's/movz\s\+x\([0-9]\+\)/nop; movz x\1/g' "$file" 2>/dev/null || true
            fi
          done
          echo "✓ ARM64 混淆完成"

      - name: 【第四层】编译选项优化 - 散布代码
        run: |
          cd frida
          find . -maxdepth 4 -name "meson.build" | while read f; do
            if grep -q "project(" "$f"; then
              echo "更新编译配置: $f"
              sed -i "/add_project_arguments\|project(/a\\
                add_global_arguments('-O1',\\
                  '-fno-inline',\\
                  '-fno-reorder-blocks',\\
                  '-fno-reorder-functions',\\
                  '-fno-optimize-sibling-calls',\\
                  '-fno-asynchronous-unwind-tables',\\
                  '-fno-unwind-tables',\\
                  '-fvisibility=hidden',\\
                  '-ffunction-sections',\\
                  '-fdata-sections',\\
                  language: 'c')" "$f" 2>/dev/null || true
            fi
          done
          echo "✓ 编译配置优化完成"

      - name: 编译 Android arm64 服务端
        run: |
          cd frida
          export CFLAGS="-O1 -g0 -fno-inline -fno-reorder-blocks -fno-optimize-sibling-calls -fvisibility=hidden -ffunction-sections -fdata-sections"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-Wl,--gc-sections,-z,relro,-z,now,--no-merge-exidx-entries"
          echo "开始编译 (混淆模式)..."
          make server-android-arm64 2>&1 | tail -50

      - name: 【第五层】后编译二进制混淆
        run: |
          cd frida
          # 动态查找编译产物路径 (适配 16.x 可能的路径变化)
          SERVER_BIN=$(find build/ -name frida-server -type f | grep android-arm64 | head -n 1)
          
          if [ -z "$SERVER_BIN" ] || [ ! -f "$SERVER_BIN" ]; then
            echo "错误：未找到编译产物。可能是编译失败或路径不匹配。"
            find build/ -maxdepth 5 || true
            exit 1
          fi
          
          echo "找到产物: $SERVER_BIN"
          mkdir -p ../out
          
          # ========== 1. 深度字符串替换 (保留原逻辑) ==========
          echo "【1】字符串混淆..."
          STRINGS_TO_REPLACE=(
            's/gum_interceptor_attach/system_register_event___/g'
            's/gum_interceptor_detach/system_unregister_event__/g'
            's/gum_interceptor/gum_system_mon/g'
            's/frida:rpc/android:ipc/g'
            's/frida:auth/android:auth/g'
            's/FRIDA/SYSD/g'
            's/frida/android/g'
            's/Frida/Android/g'
            's/27042/65535/g'
            's/gmain/GCWorker/g'
            's/gdbus/DBusWorker/g'
            's/gum-js-loop/JSRuntime/g'
            's/frida-agent/agent64/g'
            's/frida-jit/jit64/g'
            's/frida-server/system64/g'
            's/gum-allocator/allocator/g'
            's/gum-debug/debugger/g'
            's/gum-thread/worker/g'
            's/gummemory/memory/g'
            's/re\.frida/com\.android/g'
            's/"interceptor"/"monitor"/g'
            's/"listener"/"handler"/g'
            's/"probe"/"event"/g'
            's/"attach"/"bind"/g'
            's/"detach"/"unbind"/g'
          )
          for rule in "${STRINGS_TO_REPLACE[@]}"; do
            sed -i "$rule" "$SERVER_BIN" 2>/dev/null || true
          done
          
          # ========== 2. ELF 段清理 ==========
          echo "【2】清除 ELF 调试信息..."
          strip --strip-all "$SERVER_BIN" 2>/dev/null || true
          objcopy --strip-all --remove-section=.comment --remove-section=.note.gnu.build-id "$SERVER_BIN" 2>/dev/null || true
          
          # ========== 3. ELF 头部匿名化 (修复环境变量注入) ==========
          echo "【3】ELF 头部匿名化..."
          python3 -c "import os; f=open('$SERVER_BIN', 'r+b'); f.seek(7); f.write(b'\x00\x00'); f.close()"
          
          # ========== 4. 代码混淆与压缩 ==========
          echo "【4】UPX 压缩 + 随机填充..."
          upx --best --lzma --overlay=strip "$SERVER_BIN" 2>/dev/null || true
          python3 -c "import os; f=open('$SERVER_BIN', 'ab'); f.write(os.urandom(8192)); f.close()"
          
          # ========== 5. 最终验证 ==========
          strings "$SERVER_BIN" | grep -iE "frida|interceptor" && echo "[!] 警告：仍有特征" || echo "✓ 特征清理完成"
          cp "$SERVER_BIN" ../out/frida-server-final

      - name: 【第六层】生成高级运行时对抗脚本
        run: |
          cat > out/anti-detect-ultimate.js << 'EOF'
          const CONFIG = { DEBUG: false, ENABLE_MEMORY_CHECK: true, ENABLE_HOOK_HIDING: true, ENABLE_STACK_FILTERING: true };
          function hookProcessAPIs() {
              try {
                  var prctl = Module.findExportByName(null, "prctl");
                  if (prctl) {
                      Interceptor.attach(prctl, { onEnter: function(args) { if (args[0].toInt32() === 15) args[1] = Memory.allocUtf8String("surfaceflinger"); } });
                  }
                  ["getpid", "gettid"].forEach(function(fn) {
                      var func = Module.findExportByName(null, fn);
                      if (func) Interceptor.attach(func, { onLeave: function(retval) { var pid = retval.toInt32(); if (pid < 1000) retval.replace(1000 + (pid % 9000)); } });
                  });
              } catch(e) {}
          }
          function hookFileSystemAPIs() {
              try {
                  var open = Module.findExportByName(null, "open");
                  var openat = Module.findExportByName(null, "openat");
                  [open, openat].forEach(function(fn) {
                      if (fn) Interceptor.attach(fn, { onEnter: function(args) { var path_ptr = openat ? args[1] : args[0]; var path = path_ptr.readCString(); if (path && path.match(/\/proc\/.*\/(maps|status|cmdline)/)) this.block = true; }, onLeave: function(retval) { if (this.block) retval.replace(-1); } });
                  });
              } catch(e) {}
          }
          function hookThreadAPIs() {
              try {
                  var pthread_setname_np = Module.findExportByName(null, "pthread_setname_np");
                  if (pthread_setname_np) {
                      Interceptor.attach(pthread_setname_np, { onEnter: function(args) { var name = args[1].readCString(); if (name && name.match(/gmain|gdbus|gum|frida/i)) { args[1] = Memory.allocUtf8String("Thread_" + Math.floor(Math.random() * 10000)); } } });
                  }
              } catch(e) {}
          }
          function hookMemoryAPIs() {
              try {
                  var mmap = Module.findExportByName(null, "mmap");
                  if (mmap) { Interceptor.attach(mmap, { onEnter: function(args) { var prot = args[2].toInt32(); if ((prot & 7) === 7) args[2] = ptr(prot & ~4); } }); }
              } catch(e) {}
          }
          function hookDebugAPIs() {
              try {
                  var ptrace = Module.findExportByName(null, "ptrace");
                  if (ptrace) Interceptor.attach(ptrace, { onLeave: function(retval) { retval.replace(-1); } });
              } catch(e) {}
          }
          function hookJavaAPIs() {
              try { Java.perform(function() {
                  var ClassLoader = Java.use("java.lang.ClassLoader");
                  ClassLoader.loadClass.overload('java.lang.String').implementation = function(className) { if (className.match(/frida|gum|xposed|hook|inject/i)) throw new Error("Class not found"); return this.loadClass(className); };
                  var File = Java.use("java.io.File");
                  File.exists.implementation = function() { var path = this.getAbsolutePath(); if (path && path.match(/frida|gum/i)) return false; return this.exists(); };
              }); } catch(e) {}
          }
          function hideHookChain() {
              try {
                  Object.defineProperty(Interceptor, 'attach', { enumerable: false, configurable: false });
                  Object.defineProperty(Interceptor, '_hooks', { value: new Map(), enumerable: false, writable: false });
              } catch(e) {}
          }
          function initialize() {
              hookProcessAPIs(); hookFileSystemAPIs(); hookThreadAPIs(); hookMemoryAPIs(); hookDebugAPIs();
              if (Java.available) hookJavaAPIs();
              hideHookChain();
              console.log("[✓] 终极对抗系统已激活 - 完全隐身模式");
          }
          setTimeout(initialize, 1000);
          EOF

      - name: 生成启动脚本和文档
        run: |
          mkdir -p out/docs
          cat > out/run-ultimate.sh << 'EOF'
          #!/bin/bash
          SERVER="./frida-server-final"
          SCRIPT="./anti-detect-ultimate.js"
          PORT=65535
          chmod +x "$SERVER"
          "$SERVER" -l 127.0.0.1:$PORT --load="$SCRIPT" &
          echo "[✓] 服务已启动 (PORT: $PORT)"
          wait
          EOF
          chmod +x out/run-ultimate.sh
          echo "# Frida 终极隐身版指南" > out/docs/ULTIMATE-GUIDE.md

      - name: 【第七层】最终打包与验证
        run: |
          cd out
          zip -q frida-ultimate.zip frida-server-final anti-detect-ultimate.js run-ultimate.sh docs/
          sha256sum frida-ultimate.zip > frida-ultimate.zip.sha256

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip*
          retention-days: 30
