name: Build Florida 16.5.6 (自动路径查找版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed

      - name: 克隆官方 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6 魔改基底
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用 Florida 原生补丁
        run: |
          cp -rf florida/* frida/ 2>/dev/null || true

      - name: 移除 frida-python/frida-tools（避免 pyconfig.h 错误）
        run: |
          cd frida
          sed -i '/subproject.*frida-python/d' meson.build
          sed -i '/subproject.*frida-tools/d' meson.build

      - name: 3层反检测隐身补丁
        run: |
          cd frida
          GUM_DIR="subprojects/frida-gum/gum"

          # 1. 端口隐藏（改默认 27042 → 57331）
          sed -i 's/27042/57331/g' $GUM_DIR/gum-server.c 2>/dev/null || true
          # 2. 内存名称隐藏（maps 里不显示 frida-agent）
          sed -i 's/"frida-agent"/"libsys"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true
          sed -i 's/"frida-jit"/"libcache"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true
          # 3. 线程名伪装（消除 frida/gum 特征）
          sed -i 's/"gum-js-loop"/"sys-loop"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true
          sed -i 's/"frida-thread"/"sys-thread"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true
          # 4. 取消 RWX 内存（避免内存扫描）
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' $GUM_DIR/gummemory.c 2>/dev/null || true

      - name: 编译 Android arm64 版本
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      # 🔥 关键：自动查找 frida-server 真实路径
      - name: 查找 frida-server 路径
        id: find_server
        run: |
          cd frida
          SERVER_PATH=$(find build -name "frida-server" | head -1)
          echo "server_path=$SERVER_PATH" >> $GITHUB_OUTPUT
          echo "找到 frida-server 路径: $SERVER_PATH"

      - name: 上传可下载的 frida-server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64
          path: frida/${{ steps.find_server.outputs.server_path }}
