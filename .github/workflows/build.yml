name: 🔥 Frida 16.5.6 手游测试稳定版（修复releng + 过检测）

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 📦 安装系统依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y \
            build-essential \
            lib32stdc++-12-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            curl \
            git \
            zip \
            unzip \
            python3 \
            python3-pip \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            valac \
            clang \
            llvm-14 \
            gcc-multilib \
            g++-multilib \
            binutils
          pip3 install --upgrade pip wheel

      - name: 📥 克隆 Frida 16.5.6 源码
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 0
          path: frida

      - name: 🛠️ 手动配置 Android NDK 环境（兼容16.5.6）
        run: |
          cd frida
          # 安装官方依赖的 Python 库
          pip3 install -r requirements.txt || true
          # 手动安装 Android NDK (r25b)
          mkdir -p build/android-ndk
          cd build/android-ndk
          # 下载 NDK (Frida 16.5.6 兼容版本)
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          # 配置环境变量 (告诉Frida去哪里找NDK)
          echo "ANDROID_NDK_PATH=$PWD/android-ndk-r25b" >> $GITHUB_ENV

      - name: ⚠️ 彻底禁用 frida-python（防止编译崩溃）
        run: |
          cd frida
          # 直接删除目录，彻底避免编译冲突
          rm -rf subprojects/frida-python
          sed -i '/frida-python/d' meson.build || true

      - name: 🛡️ 手游特征隐藏与混淆（温和版）
        run: |
          cd frida
          
          # 1. 修改默认通信端口（避开特征端口）
          find . -name "*.c" -o -name "*.h" -o -name "*.vala" | xargs sed -i 's/27042/31337/g' 2>/dev/null || true

          # 2. 全局名称混淆（把 frida/gum 替换为系统服务名）
          find . -name "*.c" -o -name "*.h" -o -name "*.vala" | xargs sed -i \
            -e 's/"frida"/"system_service"/g' \
            -e 's/"gum-/"/lib-/g' \
            -e 's/frida_/sys_/g' \
            -e 's/gum_/sys_/g' 2>/dev/null || true

          # 3. 进程/线程名伪装（伪装成系统进程）
          sed -i 's/"frida-server"/"surfaceflingerd"/g' ./frida-server/frida-server.c 2>/dev/null || true
          sed -i 's/"gum-js-loop"/"system_work_thread"/g' ./frida-gum/gum/gum-thread.c 2>/dev/null || true
          sed -i 's/"gmain"/"system_handler"/g' ./frida-gum/gum/gum-thread.c 2>/dev/null || true

          # 4. 关闭 RWX 内存特征（减少检测暴露）
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' ./frida-gum/gum/gummemory.c 2>/dev/null || true

      - name: 🔨 编译 Android arm64 服务端
        run: |
          cd frida
          # 配置编译参数
          export CFLAGS="-O2 -g0 -fvisibility=hidden -fno-unwind-tables"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-Wl,--gc-sections,-z,relro,-z,now"
          # 指定 NDK 路径
          export ANDROID_NDK=$ANDROID_NDK_PATH/android-ndk-r25b
          # 使用官方目标编译 (Frida 16.5.6 官方命令)
          make server-android-arm64 -j$(nproc)

      - name: 🧹 二进制清理与去特征
        run: |
          cd frida
          # 找到编译好的二进制文件
          SERVER=$(find build -name frida-server -type f | head -1)
          mkdir -p ../out
          
          # 清除符号表和调试信息
          strip --strip-all $SERVER
          objcopy --remove-section=.comment --remove-section=.note $SERVER
          
          cp $SERVER ../out/frida-server

      - name: 📄 生成手游反检测脚本
        run: |
          cat > out/anti_detect.js <<'EOF'
          setTimeout(function(){
              console.log("[+] 手游反检测模块已加载");
              
              // 防自杀/防被kill（拦截退出函数）
              ["exit", "exit_group", "kill", "raise"].forEach(func => {
                  let addr = Module.findExportByName(null, func);
                  if (addr) {
                      Interceptor.replace(addr, new NativeCallback(() => { return -1; }, 'int', []));
                  }
              });

              // 拦截 /proc/maps /status 扫描（防内存检测）
              ["open", "openat"].forEach(func => {
                  let addr = Module.findExportByName(null, func);
                  if (addr) {
                      Interceptor.attach(addr, {
                          onEnter(args) {
                              let path = args[func == "openat" ? 1 : 0].readCString();
                              if (path && (path.includes("maps") || path.includes("status"))) {
                                  this.block = true;
                              }
                          },
                          onLeave(ret) {
                              if (this.block) ret.replace(-1);
                          }
                      });
                  }
              });

              console.log("[+] 隐身保护完成");
          }, 500);
          EOF

      - name: 📦 打包最终产物
        run: |
          cd out
          zip -r frida_1656_complete.zip frida-server anti_detect.js

      - name: 🚀 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: frida-android-game-build
          path: out/frida_1656_complete.zip
          retention-days: 7
