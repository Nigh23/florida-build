name: Build Florida 16.5.6 最终稳定版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装完整编译依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            lib32stdc++-12-dev \
            curl git zip sed \
            python3 python3-dev python3-pip \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            upx

      - name: 修复Python头文件路径
        run: |
          python3 -c "import sysconfig; print(sysconfig.get_paths())"

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用Florida补丁
        run: |
          cp -rf florida/* frida/ 2>/dev/null

      - name: 移除frida-python避免编译冲突
        run: |
          cd frida
          sed -i '/subproject.*frida-python/d' meson.build || true

      - name: 全套去特征修改
        run: |
          cd frida
          GUM_DIR="subprojects/frida-gum/gum"

          # 端口
          sed -i 's/27042/59999/g' $GUM_DIR/gum-server.c
          # maps名称
          sed -i 's/"frida-agent"/"libsys"/g' $GUM_DIR/gum-allocator.c
          sed -i 's/"frida-jit"/"libcache"/g' $GUM_DIR/gum-allocator.c
          # 线程名
          sed -i 's/"gum-js-loop"/"sys-loop"/g' $GUM_DIR/gum-thread.c
          sed -i 's/"frida-thread"/"sys-task"/g' $GUM_DIR/gum-thread.c
          # frida-server 进程名
          sed -i 's/"frida-server"/"system_server"/g' src/frida-server.c
          # ptrace 反调试
          sed -i 's/ptrace(/syscall(SYS_ptrace,/g' $GUM_DIR/gum-debug.c
          # 取消RWX
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' $GUM_DIR/gummemory.c

      - name: 编译 Android arm64
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      - name: 提取纯净服务端
        run: |
          mkdir -p out
          SERVER=$(find frida/build -name frida-server -type f | head -1)
          cp "$SERVER" out/frida-server

      - name: 瘦身strip
        run: |
          strip --strip-all out/frida-server || true

      - name: UPX压缩
        run: |
          upx --best --lzma out/frida-server || true

      - name: 打包
        run: |
          cd out
          zip florida-server-arm64.zip frida-server

      - name: 上传最终服务端
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-arm64
          path: out/florida-server-arm64.zip
