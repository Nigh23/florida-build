name: Build Frida 16.5.6 终极隐身版 (路径修正最终版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 清理磁盘空间并优化内存
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo swapoff -a
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential lib32stdc++-12-dev lib32z1-dev libc6-dev-i386 \
            curl git zip sed python3 python3-dev python3-pip \
            libglib2.0-dev ninja-build pkgconf upx \
            openjdk-11-jdk valac clang llvm-14 gcc-multilib g++-multilib binutils
          sudo pip3 install --upgrade pip

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          path: frida

      - name: 克隆 Florida 并集成
        run: |
          git clone --recursive --depth 1 -b 16.5.6 https://github.com/Ylarod/Florida florida
          cp -rvf florida/* frida/ || true

      - name: 【第一层至第三层】源码混淆 (修正路径版)
        run: |
          cd frida
          # 重要修正：Frida 核心组件位于 subprojects 目录下
          TARGET_DIRS="subprojects/frida-gum subprojects/frida-core"
          
          # 1. 隐藏 Hook 数据结构 (你的原逻辑)
          G_INTER=$(find subprojects/frida-gum -name "guminterceptor.c" | head -1)
          if [ -f "$G_INTER" ]; then
            echo "发现 guminterceptor: $G_INTER"
            sed -i 's/struct.*_GumInterceptor/struct _GumSystemMonitor/g' "$G_INTER"
            sed -i 's/GumInterceptor/GumSystemMonitor/g' "$G_INTER"
            sed -i 's/attached_listeners/registered_callbacks/g' "$G_INTER"
            sed -i 's/gum_interceptor_attach/gum_system_monitor_register/g' "$G_INTER"
          fi
          
          # 2. 基础字符串混淆 (你的原逻辑)
          # 搜索范围扩大到 subprojects 以覆盖所有核心代码
          find $TARGET_DIRS -type f \( -name "*.c" -o -name "*.h" -o -name "*.vala" \) 2>/dev/null | xargs sed -i \
            -e 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' \
            -e 's/"frida"/"arm64v8"/g' \
            -e 's/frida_/android_/g' \
            -e 's/FRIDA_/ANDROID_/g' \
            -e 's/"frida-server"/"com.android.system.sync"/g' \
            -e 's/"frida-agent"/"libandroid_runtime"/g' 2>/dev/null || true

          # 3. 线程与内存隐藏 (你的原逻辑)
          GUM_DIR=$(find subprojects/frida-gum -type d -name "gum" | grep -v "arch" | head -1)
          if [ -n "$GUM_DIR" ]; then
            echo "发现 gum 目录: $GUM_DIR"
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"gmain"/"GCHandlerThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null || true
          fi
          
          # 4. ARM64 特征指令模糊 (保持原样)
          ARM64_FILES=$(find subprojects/frida-gum -path "*/arch-arm64/*" -name "*.c")
          for f in $ARM64_FILES; do
            sed -i 's/\bb\s\+/adrp x8, #0; ldr x8, [x8]; br x8  \/\/ /g' "$f" 2>/dev/null || true
          done

      - name: 【第四层】编译参数注入
        run: |
          cd frida
          # 在 meson.build 中注入混淆参数
          sed -i "/default_options:/a \ \nadd_global_arguments('-O1', '-fno-inline', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections', language: 'c')" meson.build

      - name: 编译 Android arm64 服务端
        run: |
          cd frida
          export CFLAGS="-O1 -fvisibility=hidden"
          # 使用 -j 2 并行编译，平衡内存和速度
          make server-android-arm64 NINJA_FLAGS="-j 2" || (tail -n 100 build/meson-logs/meson-log.txt && exit 1)

      - name: 【第五层】后编译二进制混淆
        run: |
          cd frida
          SERVER_BIN=$(find build/ -name frida-server -type f | grep android-arm64 | head -n 1)
          
          if [ -z "$SERVER_BIN" ]; then
            echo "错误：未找到编译产物"
            find build/ -maxdepth 5
            exit 1
          fi
          
          mkdir -p ../out
          cp "$SERVER_BIN" ../out/frida-server-final
          cd ../out
          
          # 二进制处理逻辑
          strip --strip-all frida-server-final
          python3 -c "f=open('frida-server-final','r+b'); f.seek(7); f.write(b'\x00\x00'); f.close()"
          upx --best --lzma frida-server-final || true
          
          # 生成你的对抗脚本
          cat > anti-detect.js << 'EOF'
          function initialize() {
              var prctl = Module.findExportByName(null, "prctl");
              if (prctl) {
                  Interceptor.attach(prctl, { onEnter: function(args) { if (args[0].toInt32() === 15) args[1] = Memory.allocUtf8String("surfaceflinger"); } });
              }
              console.log("[✓] 终极对抗系统已启动");
          }
          setTimeout(initialize, 1000);
          EOF

          zip -r frida-ultimate.zip frida-server-final anti-detect.js

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip
