name: Build Frida 16.5.6 DNF专用去特征版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential python3 python3-pip git curl ninja-build meson \
            valac libglib2.0-dev libunwind-dev libcapstone-dev libffi-dev \
            openjdk-11-jdk zip binutils-aarch64-linux-gnu

      - name: 克隆源码
        run: |
          git clone --depth=1 --branch 16.5.6 --recurse-submodules https://github.com/frida/frida.git frida
          git clone --depth=1 --branch 16.5.6 https://github.com/Ylarod/Florida.git florida

      - name: 应用 Florida 补丁
        run: |
          cd frida
          set +e
          cp -Rf ../florida/frida-gum/. frida-gum/
          cp -Rf ../florida/frida-core/. frida-core/
          set -e

      - name: DNF 专用去特征码（源码级）
        run: |
          cd frida
          set +e
          
          # 改默认端口
          find . -type f \( -name *.c -o -name *.h \) | xargs sed -i 's/27042/53221/g'
          
          # 清理线程名特征
          find ./frida-gum -name "*.c" | xargs sed -i 's/"gum-js-loop"/"android.ui"/g'
          find ./frida-gum -name "*.c" | xargs sed -i 's/"frida-thread"/"system-work"/g'
          find ./frida-gum -name "*.c" | xargs sed -i 's/"gum"/"sys"/g'
          
          # 清理模块名字符串
          find ./frida-gum ./frida-core -type f \( -name *.c -o -name *.h \) | xargs sed -i 's/"frida-agent"/"libart"/g'
          find ./frida-gum ./frida-core -type f \( -name *.c -o -name *.h \) | xargs sed -i 's/"frida-jit"/"libandroid"/g'
          find ./frida-gum ./frida-core -type f \( -name *.c -o -name *.h \) | xargs sed -i 's/"frida"/"sys"/g'
          
          set -e

      - name: 配置 Android arm64 交叉编译
        run: |
          cd frida
          meson setup build \
            --cross-file=releng/meson/cross/android_arm64.txt \
            -Ddefault_library=static \
            -Doptimization=s \
            -Db_ndebug=true \
            -Dstrip=true \
            -Dserver=true \
            -Dgadget=false \
            -Dandroid=arm64 \
            -Dtests=false

      - name: 编译 frida-server
        run: |
          cd frida
          ninja -C build frida-server-android-arm64

      - name: 提取并清理 ELF 符号
        run: |
          mkdir -p out
          cd frida
          SERVER=$(find build -name frida-server | grep android-arm64 | head -1)
          cp "$SERVER" ../out/frida-server
          cd ../out
          aarch64-linux-gnu-strip --strip-all frida-server
          aarch64-linux-gnu-objcopy --remove-section=.comment --remove-section=.note.gnu.build-id frida-server
          chmod 755 frida-server

      - name: 打包
        run: |
          cd out
          zip frida-16.5.6-dnf-arm64.zip frida-server

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-dnf-arm64
          path: out/frida-16.5.6-dnf-arm64.zip
          retention-days: 30
