name: Build Florida 16.5.6 arm64 (Full Obfuscate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed

      - name: Clone Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: Full Obfuscate (RPC + Pipe + Port + Thread + Anti-Debug)
        run: |
          cd frida

          # 1. 修改RPC通信协议、管道标识（核心防检测）
          find . -type f \( -name "*.vala" -o -name "*.c" -o -name "*.h" \) -exec sed -i \
            -e 's/"frida"/"sysd"/g' \
            -e 's/"frida-rpc"/"datachannel"/g' \
            -e 's/"frida_"/"sys_"/g' \
            -e 's/Frida/System/g' \
            -e 's/gum/kernel/g' {} +

          # 2. 修改默认通信端口 27042 → 51234
          sed -i 's/27042/51234/g' lib/gum/gum-server.c || true

          # 3. 隐藏线程名、移除调试标记
          sed -i 's/"frida-thread"/"system-worker"/g' lib/gum/gum-thread.c || true
          sed -i 's/gum_script_pinning_breakpoints = TRUE/gum_script_pinning_breakpoints = FALSE/g' lib/frida/script.c || true

          # 4. 屏蔽ptrace反调试检测
          sed -i 's/ptrace/ptrace_ignore/g' lib/gum/gum-debug.c || true

      - name: Build android-arm64
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      - name: Upload frida-server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64
          path: frida/build/frida-android-arm64/bin/frida-server
