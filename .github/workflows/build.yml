name: Build Frida 16.5.6 终极隐身版 (修复版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装完整编译依赖
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev lib32z1-dev libc6-dev-i386 curl git zip sed python3 python3-dev python3-pip libglib2.0-dev ninja-build pkg-config upx openjdk-11-jdk valac clang llvm-14 gcc-multilib g++-multilib binutils
          pip3 install --upgrade pip

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          path: frida

      - name: 克隆 Florida 16.5.6 并合并
        run: |
          git clone --recursive --depth 1 -b 16.5.6 https://github.com/Ylarod/Florida florida
          cp -rvf florida/* frida/ || true

      - name: 【第一层至第四层】源码混淆 (保持原逻辑, 仅保护编译引擎)
        run: |
          cd frida
          
          # 【重要修复】定义需要混淆的源码目录，避开 releng (编译系统) 和 build 目录
          # 否则编译系统会因为变量名被改而崩溃
          SRC_TARGETS="frida-gum frida-core server src"

          # 1. 隐藏 Hook 数据结构 (你的原逻辑)
          GUM_INTERCEPTOR=$(find frida-gum -name "guminterceptor.c" | head -1)
          if [ -f "$GUM_INTERCEPTOR" ]; then
            sed -i 's/struct.*_GumInterceptor/struct _GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/GumInterceptor/GumSystemMonitor/g' "$GUM_INTERCEPTOR"
            sed -i 's/attached_listeners/registered_callbacks/g' "$GUM_INTERCEPTOR"
            sed -i 's/gum_interceptor_attach/gum_system_monitor_register/g' "$GUM_INTERCEPTOR"
          fi

          # 2. 基础字符串混淆 (你的原逻辑, 但限制在源码目录)
          find $SRC_TARGETS -type f \( -name "*.c" -o -name "*.h" -o -name "*.vala" \) 2>/dev/null | xargs sed -i \
            -e 's/#define FRIDA_SERVER_PORT 27042/#define FRIDA_SERVER_PORT 59999/g' \
            -e 's/"frida"/"arm64v8"/g' \
            -e 's/frida_/android_/g' \
            -e 's/FRIDA_/ANDROID_/g' \
            -e 's/"frida-server"/"com.android.system.sync"/g' \
            -e 's/"frida-agent"/"libandroid_runtime"/g' 2>/dev/null || true

          # 3. 线程与进程隐藏 (你的原逻辑)
          GUM_DIR=$(find frida-gum -type d -name "gum" | head -1)
          if [ -n "$GUM_DIR" ]; then
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/"gmain"/"GCHandlerThread"/g' "$GUM_DIR"/gum-thread.c 2>/dev/null || true
            sed -i 's/ptrace(/syscall(SYS_ptrace,/g' "$GUM_DIR"/gum-debug.c 2>/dev/null || true
          fi

          # 4. 编译参数注入 (你的原逻辑)
          sed -i "/project('frida'/a add_global_arguments('-O1', '-fno-inline', '-fvisibility=hidden', '-ffunction-sections', '-fdata-sections', language: 'c')" meson.build

      - name: 编译 Android arm64 服务端
        run: |
          cd frida
          # 显式指定 Android 编译目标
          make server-android-arm64 || (echo "编译失败! 正在输出最后日志..." && tail -n 200 build/meson-logs/meson-log.txt && exit 1)

      - name: 【第五层】后编译二进制混淆与打包
        run: |
          cd frida
          # 动态查找编译产物 (解决路径不匹配问题)
          SERVER_BIN=$(find build/ -name frida-server -type f | grep android-arm64 | head -n 1)
          
          if [ -z "$SERVER_BIN" ] || [ ! -f "$SERVER_BIN" ]; then
            echo "错误：未找到编译产物。 build 目录内容如下："
            find build/ -maxdepth 5
            exit 1
          fi
          
          mkdir -p ../out
          # 复制到输出目录进行二次处理
          cp "$SERVER_BIN" ../out/frida-server-final
          
          cd ../out
          # 你的二进制混淆逻辑
          strip --strip-all frida-server-final
          python3 -c "f=open('frida-server-final','r+b'); f.seek(7); f.write(b'\x00\x00'); f.close()"
          upx --best --lzma frida-server-final || true
          
          # 生成你的对抗脚本 (原样保留)
          cat > anti-detect-ultimate.js << 'EOF'
          function initialize() {
              var prctl = Module.findExportByName(null, "prctl");
              if (prctl) {
                  Interceptor.attach(prctl, { onEnter: function(args) { if (args[0].toInt32() === 15) args[1] = Memory.allocUtf8String("surfaceflinger"); } });
              }
              console.log("[✓] 终极对抗系统已激活");
          }
          setTimeout(initialize, 1000);
          EOF

          zip -r frida-ultimate.zip frida-server-final anti-detect-ultimate.js

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip
