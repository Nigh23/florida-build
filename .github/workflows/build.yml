name: Build Florida 16.5.6 DNF专用版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 git curl ninja-build meson \
            valac libglib2.0-dev libunwind-dev libcapstone-dev libffi-dev \
            openjdk-11-jdk zip binutils-aarch64-linux-gnu

      - name: 克隆 Florida 16.5.6
        run: |
          git clone --depth=1 -b 16.5.6 --recurse-submodules https://github.com/Ylarod/Florida.git

      - name: DNF 去特征修改
        run: |
          cd Florida
          set +e
          find . -type f \( -name "*.c" -o -name "*.h" \) | xargs sed -i 's/27042/53221/g' 2>/dev/null
          find . -path "*/frida-gum/*" -name "*.c" | xargs sed -i 's/"gum-js-loop"/"android.ui"/g' 2>/dev/null
          find . -path "*/frida-gum/*" -name "*.c" | xargs sed -i 's/"frida-thread"/"system-work"/g' 2>/dev/null
          find . -path "*/frida-gum/*" -o -path "*/frida-core/*" | xargs sed -i 's/"frida-agent"/"libart"/g' 2>/dev/null
          find . -path "*/frida-gum/*" -o -path "*/frida-core/*" | xargs sed -i 's/"frida-jit"/"libandroid_runtime"/g' 2>/dev/null
          set -e

      - name: 编译 Android arm64
        run: |
          cd Florida
          ./releng/build --android-arm64

      - name: 提取 frida-server
        run: |
          mkdir -p out
          find Florida/build -name "frida-server" -type f | grep android-arm64 | head -1 | xargs cp -t out/
          aarch64-linux-gnu-strip --strip-all out/frida-server
          chmod 755 out/frida-server

      - name: 打包
        run: |
          cd out
          zip florida-16.5.6-dnf-arm64.zip frida-server

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: florida-16.5.6-dnf-arm64
          path: out/frida-server
          retention-days: 30
