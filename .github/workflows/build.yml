name: Build Florida 16.5.6 完整过检版

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed python3-dev

      - name: 拉取 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 拉取 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: 应用 Florida 补丁
        run: |
          cp -rf florida/* frida/ 2>/dev/null

      - name: 深度隐藏（三层防检测）
        run: |
          cd frida
          GUM_DIR="subprojects/frida-gum/gum"

          # 1. Ptrace 反调试 + 端口隐藏
          sed -i 's/ptrace(/ptrace_ignore(/g' $GUM_DIR/gum-debug.c 2>/dev/null || true
          sed -i 's/27042/55221/g' $GUM_DIR/gum-server.c 2>/dev/null || true

          # 2. 内存名称隐藏 /proc/self/maps
          sed -i 's/"frida-agent"/"libsys_mem"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true
          sed -i 's/"frida-jit"/"libsys_buf"/g' $GUM_DIR/gum-allocator.c 2>/dev/null || true

          # 3. 线程名隐藏
          sed -i 's/"gum-js-loop"/"system_work"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true
          sed -i 's/"frida-thread"/"system_task"/g' $GUM_DIR/gum-thread.c 2>/dev/null || true

          # 4. 取消 RWX 内存特征
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' $GUM_DIR/gummemory.c 2>/dev/null || true

          # 5. ARM64 Trampoline 特征码改写
          sed -i 's/\x10\x00\x00\x58/\x50\x0F\x1F\xAA/g' $GUM_DIR/arch-arm64/guminterceptor-arm64.c 2>/dev/null || true
          sed -i 's/\x00\x02\x1F\xD6/\x20\x00\x80\xD2/g' $GUM_DIR/arch-arm64/guminterceptor-arm64.c 2>/dev/null || true

      - name: 编译 android-arm64
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      - name: 上传最终 server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64-stealth
          path: frida/build/frida-android-arm64/bin/frida-server
