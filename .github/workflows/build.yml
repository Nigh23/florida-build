name: Build Frida 16.5.6 Florida DNF专用版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装基础编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential python3 git curl ninja-build 
          sudo apt install -y libglib2.0-dev libunwind-dev libcapstone-dev libffi-dev openjdk-11-jdk zip

      # 修复1：强制安装 Frida 专用 Vala（解决80%编译失败）
      - name: 安装 Frida 专属 Vala
        run: |
          git clone https://github.com/frida/vala.git
          cd vala
          ./autogen.sh
          make -j$(nproc)
          sudo make install

      - name: 克隆 Frida 16.5.6 完整源码
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          path: frida

      - name: 克隆 Florida 16.5.6 补丁
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          path: florida

      - name: 应用 Florida 补丁
        run: |
          cd frida
          cp -r ../florida/* . || true

      # 你提供的精准去特征代码（路径完全正确）
      - name: DNF 深度去特征
        run: |
          cd frida
          set +e

          # 修改端口
          find . \( -name "*.c" -o -name "*.h" \) -type f \
            | xargs sed -i 's/27042/53221/g' 2>/dev/null

          # 线程特征（GUM）
          find ./subprojects/frida-gum -name "*.c" -type f \
            | xargs sed -i 's/"gum-js-loop"/"android.ui"/g' 2>/dev/null

          find ./subprojects/frida-gum -name "*.c" -type f \
            | xargs sed -i 's/"frida-thread"/"system-work"/g' 2>/dev/null

          # 库名（GUM + CORE）
          find ./subprojects/frida-gum ./subprojects/frida-core \
            \( -name "*.c" -o -name "*.h" \) -type f \
            | xargs sed -i 's/"frida-agent"/"libart"/g' 2>/dev/null

          find ./subprojects/frida-gum ./subprojects/frida-core \
            \( -name "*.c" -o -name "*.h" \) -type f \
            | xargs sed -i 's/"frida-jit"/"libandroid_runtime"/g' 2>/dev/null

          set -e

      # 修复2：禁用 sanitizer，清空编译标志（解决gcc报错）
      - name: 禁用 Sanitizer 编译标志
        run: |
          echo "CFLAGS=-O2" >> $GITHUB_ENV
          echo "CXXFLAGS=-O2" >> $GITHUB_ENV

      # 修复3+4：官方编译命令，自动下载toolchain，必出server
      - name: 编译 frida-server android-arm64
        run: |
          cd frida
          make clean
          rm -rf build
          make server-android-arm64 -j$(nproc)

      - name: 提取并清理产物
        run: |
          mkdir -p out
          SERVER=$(find frida/build -name "frida-server" -type f | grep android-arm64 | head -1)
          cp "$SERVER" out/frida-server
          strip --strip-all out/frida-server
          chmod 755 out/frida-server

      - name: 上传最终产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-16.5.6-dnf-arm64
          path: out/frida-server
          retention-days: 30
