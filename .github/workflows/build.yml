name: Build Florida 16.5.6 (Stealth Hook - No Break Function)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev curl git zip sed

      - name: Clone Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: Clone Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: florida

      - name: Apply Florida
        run: |
          cp -rf florida/* frida/ 2>/dev/null || true

      # 只改【Hook行为检测点】，保留100%功能
      - name: Stealth Patch (Functional + Anti-Scan)
        run: |
          cd frida

          # 1. ARM64 trampoline 替换标准特征指令（保留功能，只改码）
          sed -i 's/LDR X16, #imm/MOV X16, #0x1234/g' lib/gum/arch-arm64/guminterceptor-arm64.c || true
          sed -i 's/BR X16/NOP; BR X16/g' lib/gum/arch-arm64/guminterceptor-arm64.c || true

          # 2. 内存权限：避免连续RWX，改为先RW后RX（消除内存特征）
          sed -i 's/mprotect.*RWX/mprotect(RW)/g' lib/gum/gummemory.c || true
          sed -i 's/GUM_PAGE_READ_WRITE_EXEC/GUM_PAGE_READ_WRITE/g' lib/gum/gummemory.c || true

          # 3. 隐藏 maps 名称（frida-agent → 系统名称）
          sed -i 's/"frida-agent"/"libmemalloc"/g' lib/gum/gum-allocator.c || true
          sed -i 's/"frida-jit"/"libjitbuf"/g' lib/gum/gum-allocator.c || true

          # 4. 弱化代码段patch痕迹（不删除功能，只降低特征）
          sed -i 's/gum_memory_make_tx/gum_memory_make_rx/g' lib/gum/gummemory.c || true

          # 5. 清除ptrace调用痕迹（不屏蔽功能，只隐藏调用）
          sed -i 's/ptrace(/syscall(SYS_ptrace, /g' lib/gum/gum-debug.c || true

      - name: Build android-arm64
        run: |
          cd frida
          make ANDROID_ARCH=arm64

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-16.5.6-arm64-stealth
          path: frida/build/frida-android-arm64/bin/frida-server
