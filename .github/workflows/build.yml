name: Build Frida 16.5.6 终极隐身版 (标准编译方式)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 【第0步】安装完整依赖
        run: |
          echo "=== 安装完整编译环境 ==="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-dev \
            python3-pip \
            pkg-config \
            git \
            curl \
            ninja-build \
            meson \
            valac \
            libglib2.0-dev \
            libunwind-dev \
            libcapstone-dev \
            libffi-dev \
            openjdk-11-jdk \
            upx \
            zip \
            sed \
            binutils-aarch64-linux-gnu
          
          echo "✓ 依赖安装完成"

      - name: 【第1步】克隆源码（完整子模块）
        run: |
          echo "=== 克隆 Frida 16.5.6 ==="
          git clone --depth=1 --branch=16.5.6 --recurse-submodules https://github.com/frida/frida.git frida
          
          echo "=== 克隆 Florida 16.5.6 ==="
          git clone --depth=1 --branch=16.5.6 --recursive https://github.com/Ylarod/Florida.git florida

      - name: 【第2步】应用 Florida 补丁
        run: |
          cd frida
          echo "=== 应用 Florida 补丁 ==="
          [ -d ../florida/frida-gum ] && cp -rf ../florida/frida-gum/* frida-gum/ 2>/dev/null
          [ -d ../florida/frida-core ] && cp -rf ../florida/frida-core/* frida-core/ 2>/dev/null
          echo "✓ 补丁应用完成"

      - name: 【第3步】源码级隐身修改
        run: |
          cd frida
          echo "=== 端口/线程/名称混淆 ==="
          
          # 改默认端口 27042
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.js" \) | xargs sed -i 's/27042/57777/g' 2>/dev/null
          
          # 线程名混淆
          find ./frida-gum -name "*.c" | xargs sed -i 's/"gum-js-loop"/"system-work"/g' 2>/dev/null
          find ./frida-gum -name "*.c" | xargs sed -i 's/"frida-thread"/"system-server"/g' 2>/dev/null
          
          # 特征字符串替换
          find ./frida-gum ./frida-core -name "*.c" -o -name "*.h" | xargs sed -i 's/"frida-agent"/"libandroid_runtime"/g' 2>/dev/null
          find ./frida-gum ./frida-core -name "*.c" -o -name "*.h" | xargs sed -i 's/"frida-jit"/"libgui"/g' 2>/dev/null
          
          echo "✓ 源码混淆完成"

      - name: 【第4步】编译 Android arm64 核心配置
        run: |
          cd frida
          echo "=== 配置 Android arm64 交叉编译 ==="
          
          # 关键：指定安卓交叉编译文件 + 开启 frida-server
          meson setup build \
            --cross-file=releng/meson/cross/android_arm64.txt \
            -Ddefault_library=static \
            -Doptimization=s \
            -Db_ndebug=true \
            -Dstrip=true \
            -Dserver=true \
            -Dgadget=true \
            -Dandroid=arm64 \
            2>&1 | tee meson.log

      - name: 【第5步】编译 frida-server
        run: |
          cd frida
          echo "=== 开始 Ninja 编译 ==="
          ninja -C build frida-server-android-arm64
          echo "✓ 编译完成"

      - name: 【第6步】提取产物
        run: |
          mkdir -p out
          cd frida
          
          SERVER=$(find build -name "frida-server" -type f | grep android-arm64 | head -1)
          if [ -z "$SERVER" ] || [ ! -f "$SERVER" ]; then
            echo "[!] 未找到 frida-server"
            exit 1
          fi
          
          cp -v "$SERVER" ../out/frida-server-16.5.6-ultimate
          ls -lh ../out/
          file ../out/frida-server-16.5.6-ultimate

      - name: 【第7步】ELF 精简 + 压缩
        run: |
          cd out
          aarch64-linux-gnu-strip --strip-all frida-server-16.5.6-ultimate 2>/dev/null
          upx --best --lzma frida-server-16.5.6-ultimate || echo "upx 跳过"

      - name: 【第8步】生成反检测脚本
        run: |
          cat > out/anti-detect.js << 'EOF'
          // Frida 终极反检测运行时
          setTimeout(function(){
              console.log("[*] 反检测模块加载中");
              
              // 隐藏线程名
              var pthread_setname_np = Module.findExportByName(null, "pthread_setname_np");
              if (pthread_setname_np) {
                  Interceptor.attach(pthread_setname_np, {
                      onEnter(args) {
                          let name = args[1].readCString();
                          if (name.match(/frida|gum|gmain|gdbus/i)) {
                              args[1] = ptr(Memory.allocUtf8String("sys-" + Math.random().toString(16).substr(2,6)));
                          }
                      }
                  });
              }
              
              // 屏蔽 /proc 检测
              var open = Module.findExportByName(null, "open");
              if (open) {
                  Interceptor.attach(open, {
                      onEnter(args) {
                          let p = args[0].readCString();
                          if (p && p.includes("/proc/") && (p.includes("maps") || p.includes("status"))) {
                              this.block = true;
                          }
                      },
                      onLeave(ret) {
                          if (this.block) ret.replace(-1);
                      }
                  });
              }
              
              console.log("[✓] 反检测已激活");
          }, 800);
          EOF

      - name: 打包
        run: |
          cd out
          zip frida-ultimate-16.5.6.zip frida-server-16.5.6-ultimate anti-detect.js
          ls -lh *.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-16.5.6
          path: out/*.zip
          retention-days: 30
