name: Frida 16.5.6 Florida 稳定版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git zip sed python3 python3-dev pkg-config binutils

      - name: 克隆 Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          fetch-depth: 1
          path: frida

      - name: 克隆 Florida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: Ylarod/Florida
          ref: 16.5.6
          fetch-depth: 1
          path: florida

      - name: 正确应用 Florida 补丁
        run: |
          cd frida
          tar -cf - -C ../florida . | tar -xf -

      - name: 强制开启 frida-server
        run: |
          cd frida
          # 正确开启 server 构建（官方标准方式）
          echo "server = enabled" >> frida-core/meson.options
          sed -i 's/option.*server.*/option(''server'', type: boolean, value: true)/' releng/meson/meson_options.txt
          export FRIDA_SERVER=1
          # 禁用不需要的子项目
          sed -i '/frida-python/d' meson.build

      - name: 基础抗检测混淆
        run: |
          cd frida
          # 改端口
          find . -type f \( -name *.c -o -name *.h -o -name *.vala \) | xargs sed -i 's/27042/57777/g'
          # 改关键字符串
          find . -type f \( -name *.c -o -name *.h -o -name *.vala \) | xargs sed -i \
            -e 's/"frida-server"/"system_service"/g' \
            -e 's/"frida"/"sys_daemon"/g' \
            -e 's/"gum"/"g_lib"/g'

      - name: 编译 frida-server-android-arm64
        run: |
          cd frida
          make server-android-arm64

      - name: 提取产物
        run: |
          cd frida
          SERVER=$(find build -name "frida-server" -type f | head -1)
          mkdir -p ../out
          cp "$SERVER" ../out/

      - name: ELF 精简清理
        run: |
          cd out
          strip --strip-all frida-server

      - name: 打包
        run: |
          cd out
          zip frida-server.zip frida-server

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-arm64
          path: out/frida-server
