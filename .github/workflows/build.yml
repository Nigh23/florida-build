name: Frida 16.5.6 极简稳定版
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential lib32stdc++-12-dev lib32z1-dev curl git python3 ninja-build pkg-config valac gcc-multilib g++-multilib

      - name: 克隆Frida 16.5.6
        uses: actions/checkout@v4
        with:
          repository: frida/frida
          ref: 16.5.6
          submodules: recursive
          path: frida

      - name: 轻度特征修改
        run: |
          cd frida
          sed -i 's/27042/31337/g' $(grep -rl 27042 --include="*.c" --include="*.h" .)
          sed -i 's/"frida-server"/"system_daemon"/g' frida-server/frida-server.c

      - name: 编译Android arm64
        run: |
          cd frida
          chmod +x releng/*
          ./releng/build-android arm64

      - name: 提取产物
        run: |
          mkdir -p out
          find frida/build/android-arm64/bin -name frida-server -exec cp {} out/ \;

      - name: 打包
        run: |
          cd out
          zip frida1656_fix.zip frida-server

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: frida-final
          path: out/frida1656_fix.zip
