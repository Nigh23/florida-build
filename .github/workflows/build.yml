name: Build Frida 16.5.6 终极隐身版 (正确版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 【第0步】安装完整依赖
        run: |
          echo "=== 安装完整编译环境 ==="
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-dev \
            python3-pip \
            pkg-config \
            git \
            curl \
            ninja-build \
            meson \
            valac \
            libglib2.0-dev \
            libgobject-2.0-dev \
            libgio-2.0-dev \
            libunwind-dev \
            libcapstone-dev \
            libffi-dev \
            openjdk-11-jdk \
            upx \
            zip \
            sed
          
          echo "✓ 依赖安装完成"

      - name: 【第1步】克隆源码
        run: |
          echo "=== 克隆 Frida 16.5.6 ==="
          git clone --depth=1 --branch=16.5.6 --recursive \
            https://github.com/frida/frida.git frida
          
          echo "=== 克隆 Florida 16.5.6 ==="
          git clone --depth=1 --branch=16.5.6 --recursive \
            https://github.com/Ylarod/Florida.git florida

      - name: 【第2步】应用 Florida 补丁（安全方式）
        run: |
          cd frida
          
          echo "=== 应用 Florida 补丁 ==="
          
          # 只复制 frida-gum 目录中的文件（避免覆盖 submodules）
          if [ -d ../florida/frida-gum ]; then
            echo "复制 frida-gum 补丁..."
            cp -rf ../florida/frida-gum/* frida-gum/ 2>/dev/null || true
          fi
          
          # 只复制 frida-core 目录中的文件
          if [ -d ../florida/frida-core ]; then
            echo "复制 frida-core 补丁..."
            cp -rf ../florida/frida-core/* frida-core/ 2>/dev/null || true
          fi
          
          echo "✓ 补丁应用完成"

      - name: 【第3步】移除冲突模块
        run: |
          cd frida
          
          echo "=== 移除 frida-python ==="
          sed -i 's/^\(.*subproject.*frida-python.*\)$/#\1/' meson.build || true
          
          echo "✓ 冲突模块移除完成"

      - name: 【第4步】源码级混淆（安全方式）
        run: |
          cd frida
          
          echo "=== 源码级混淆 ==="
          
          # 方式 1: 只混淆特定文件中的特定字符串（不影响编译）
          
          # 混淆端口号（安全）
          find . -name "*.c" -o -name "*.h" | xargs grep -l "27042" 2>/dev/null | while read f; do
            sed -i 's/27042/59999/g' "$f"
          done
          echo "✓ 端口号混淆"
          
          # 混淆 Hook 相关字符串（有选择性）
          GUM_INTERCEPTOR=$(find . -path "*/frida-gum/*" -name "guminterceptor.c" 2>/dev/null | head -1)
          if [ -f "$GUM_INTERCEPTOR" ]; then
            # 备份原文件
            cp "$GUM_INTERCEPTOR" "${GUM_INTERCEPTOR}.bak"
            
            # 谨慎混淆（只改变量名，不改 API）
            sed -i 's/attached_listeners/registered_callbacks/g' "$GUM_INTERCEPTOR"
            sed -i 's/listener_list/event_queue/g' "$GUM_INTERCEPTOR"
            echo "✓ Hook 结构混淆"
          fi
          
          # 混淆线程名（在特定文件中）
          GUM_THREAD=$(find . -path "*/frida-gum/*" -name "gum-thread.c" 2>/dev/null | head -1)
          if [ -f "$GUM_THREAD" ]; then
            sed -i 's/"gum-js-loop"/"EventDispatcher"/g' "$GUM_THREAD"
            sed -i 's/"frida-thread"/"System_Server"/g' "$GUM_THREAD"
            echo "✓ 线程名混淆"
          fi
          
          # 混淆库名（在特定文件中）
          GUM_ALLOC=$(find . -path "*/frida-gum/*" -name "gum-allocator.c" 2>/dev/null | head -1)
          if [ -f "$GUM_ALLOC" ]; then
            sed -i 's/"frida-agent"/"libart"/g' "$GUM_ALLOC"
            sed -i 's/"frida-jit"/"libhwui"/g' "$GUM_ALLOC"
            echo "✓ 库名混淆"
          fi
          
          echo "✓ 源码级混淆完成"

      - name: 【第5步】编译（使用官方方式）
        run: |
          cd frida
          
          echo "=== 开始编译 Android arm64 ==="
          echo ""
          
          # 使用官方编译脚本
          if python3 releng/build.py --host=android-arm64 server 2>&1 | tee build.log; then
            echo ""
            echo "✓✓✓ 编译成功！✓✓✓"
          else
            echo ""
            echo "[!] 编译失败"
            echo ""
            echo "【编译日志最后 200 行】"
            tail -200 build.log
            exit 1
          fi

      - name: 【第6步】查找产物
        run: |
          cd frida
          
          echo "=== 查找编译产物 ==="
          
          # 查找 frida-server
          SERVER_BIN=""
          
          # 方案 1: 标准路径
          SERVER_BIN=$(find . -name "frida-server" -type f 2>/dev/null | grep -v "\.git" | head -1)
          
          if [ -z "$SERVER_BIN" ]; then
            echo "[!] 未找到 frida-server"
            echo ""
            echo "【查找所有 ELF 二进制】"
            find . -type f -executable 2>/dev/null | xargs file 2>/dev/null | grep "ELF.*ARM"
            exit 1
          fi
          
          echo "✓ 找到: $SERVER_BIN"
          file "$SERVER_BIN"
          ls -lh "$SERVER_BIN"
          
          # 复制到输出目录
          mkdir -p ../out
          cp "$SERVER_BIN" ../out/frida-server-final
          echo "✓ 已复制到输出目录"

      - name: 【第7步】后编译混淆
        run: |
          cd frida
          
          echo "=== 后编译混淆 ==="
          
          if [ ! -f ../out/frida-server-final ]; then
            echo "[!] 产物文件不存在"
            exit 1
          fi
          
          # 1. 字符串替换（二进制级）
          echo "【1】二进制字符串替换..."
          sed -i 's/27042/65535/g' ../out/frida-server-final 2>/dev/null || true
          sed -i 's/frida/system/g' ../out/frida-server-final 2>/dev/null || true
          sed -i 's/gum/lib/g' ../out/frida-server-final 2>/dev/null || true
          echo "✓ 字符串替换完成"
          
          # 2. ELF 清理
          echo "【2】ELF 清理..."
          strip --strip-all ../out/frida-server-final 2>/dev/null || true
          objcopy --remove-section=.comment \
                  --remove-section=.note.gnu.build-id \
                  ../out/frida-server-final 2>/dev/null || true
          echo "✓ ELF 清理完成"
          
          # 3. UPX 压缩
          echo "【3】UPX 压缩..."
          upx --best --lzma ../out/frida-server-final 2>/dev/null && echo "✓ 压缩完成" || echo "⚠ 跳过"
          
          echo ""
          echo "✓ 混淆完成"

      - name: 【第8步】生成反检测脚本
        run: |
          cat > out/anti-detect-ultimate.js << 'EOF'
          // Frida 运行时对抗脚本 v5.0
          
          function hookProcessAPIs() {
              try {
                  var prctl = Module.findExportByName(null, "prctl");
                  if (prctl) {
                      Interceptor.attach(prctl, {
                          onEnter: function(args) {
                              if (args[0].toInt32() === 15) {
                                  args[1] = Memory.allocUtf8String("surfaceflinger");
                              }
                          }
                      });
                  }
              } catch(e) {}
          }
          
          function hookFileSystemAPIs() {
              try {
                  var open = Module.findExportByName(null, "open");
                  if (open) {
                      Interceptor.attach(open, {
                          onEnter: function(args) {
                              var path = args[0].readCString();
                              if (path && path.match(/\/proc\/.*\/(maps|status|cmdline)/)) {
                                  this.block = true;
                              }
                          },
                          onLeave: function(retval) {
                              if (this.block) retval.replace(-1);
                          }
                      });
                  }
              } catch(e) {}
          }
          
          function hookThreadAPIs() {
              try {
                  var pthread_setname_np = Module.findExportByName(null, "pthread_setname_np");
                  if (pthread_setname_np) {
                      Interceptor.attach(pthread_setname_np, {
                          onEnter: function(args) {
                              var name = args[1].readCString();
                              if (name && name.match(/gmain|gdbus|gum|frida/i)) {
                                  args[1] = Memory.allocUtf8String("Thread_" + Math.random().toString(16).slice(2, 8));
                              }
                          }
                      });
                  }
              } catch(e) {}
          }
          
          function initialize() {
              console.log("[*] 启动运行时对抗系统...");
              hookProcessAPIs();
              hookFileSystemAPIs();
              hookThreadAPIs();
              console.log("[✓] 对抗系统已激活");
          }
          
          setTimeout(initialize, 1000);
          EOF
          
          echo "✓ 反检测脚本生成完成"

      - name: 【第9步】最终打包
        run: |
          cd out
          
          echo "=== 最终打包 ==="
          
          if [ ! -f frida-server-final ]; then
            echo "[!] 产物不存在"
            exit 1
          fi
          
          echo "【产物信息】"
          file frida-server-final
          ls -lh frida-server-final
          
          # 打包
          zip -q frida-ultimate.zip frida-server-final anti-detect-ultimate.js
          sha256sum frida-ultimate.zip > frida-ultimate.zip.sha256
          
          echo ""
          echo "✓✓✓ 最终打包完成！✓✓✓"
          ls -lh frida-ultimate.zip*

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-ultimate-build
          path: out/frida-ultimate.zip*
          retention-days: 30
